[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-player"
version = "0.3.9"
requires-python = ">=3.9"
dependencies = ["paho-mqtt>=1.5.1,<3"]
description = "MQTT-controlled MPD audio device for MIRA/OpenWrt"

[project.scripts]
mira-player = "mira_player.app:main"
mira-wifi = "mira_wifi.cli:main"
mira-wifi-service = "mira_wifi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mira_wifi = ["static/*.html", "static/*.css", "static/*.js"]
